[connect]
host="127.0.0.1"
socket=""
user_db="root"
pass_db="secret"
dbase="likespa"
sitename="FreeSaaS"
; Optional robot user id (publishes staff report tickets/comments). 0 = first director.
; robot_id=0

[app]
name="FreeSaaS"
; Fallback under the logo / tab title when base_system.company is empty (edit Company in Settings).
instance="Demo"
timezone="UTC"
locale="ru"
; Runtime role when entrypoint does not set FREESAAS_ROLE: admin | storefront.
; Prefer site.php (defines storefront) vs index.php (admin) on two vhosts.
; role=admin
; Public site host without scheme (promo/cart absolute links; storefront install).
; public_host="www.example.com"
; Staff admin host without scheme (storefront /login redirects here when set).
; admin_host="admin.example.com"
; Optional explicit locale list (comma-separated). Empty = discover from app/lang/*.php
; locales="ru,en"
; Days for "remember me" session cookie (default 7). Sliding: refreshed on each visit.
; session_remember_days=7
; Idle timeout in minutes (default 120). Server rejects the session after this much inactivity;
; remember days only affect the cookie lifetime, NOT idle — staff still re-login after a long pause.
; For a full workday without re-login use e.g. 480; set 0 to disable idle (cookie/remember still apply).
; session_idle_minutes=120
; session_idle_minutes=480
; How often Auth::check() reloads enabled/auth_epoch/permissions from DB (seconds, default 60).
; Unsafe methods and capability-gated routes always refresh.
; session_guard_seconds=60
; Optional session cookie Domain (e.g. .example.com) so admin_host and public_host share login.
; Needed for sticker QR (/qr2.php on public host) when staff log in on a different admin host.
; Leave empty for host-only cookies (default). Do NOT set the same parent Domain on two
; different FreeSaaS installs (mf vs spa) — cookie names would collide; use session_name=.
; session_cookie_domain=
; Optional fixed session cookie name (a-z0-9_, max 48). Empty = freesaas_<host-or-domain-slug>.
; session_name=
; Shared-hosting agent API token (header X-FreeSaaS-Agent-Token or ?token=). Leave empty/CHANGE_ME to disable /agent/*.
; agent_token="CHANGE_ME"
; When 0 (default), product JSON/agent delete ops (EntityDelete + BulkActions delete) are refused.
; Staff UI with *.delete permissions is unaffected. Toggle also on /settings → Agent.
; agent_allow_delete=0

[salts]
cookie="CHANGE_ME_COOKIE_SALT"
; Legacy-compat only: verifies remaining sha1(md5(plain.site)) password rows.
; Do NOT rotate — rotation locks out every account still on the legacy hash.
; New passwords use password_hash (argon2id/bcrypt) and do not use this key.
site="CHANGE_ME_SITE_SALT"

[modules]
; Absent keys default to enabled (Config::moduleEnabled). List every discovered module
; explicitly so greenfield copies of this file do not silently turn on WIP packs.
core=1
comments=1
contracts=1
clients=1
units=1
suppliers=1
cabinets=1
catalog=1
procedures=1
orders=1
workweeks=1
calendar=1
stocks=1
stickers=1
norms=1
sheets=0
tables=0
rates=1
vacations=1
payments=1
bonuses=0
procents=1
ledger=1
funds=1
finance=1
polls=0
poll_invites=0
; Speech recognition (bots / Whisper worker — no cabin analytics):
asr=0
; Audio analytics family (enable after schema migrate; pipeline needs asr):
audio=0
audio_dicts=0
audio_pipeline=0
audio_reports=0
audio_llm=0
llm=0
bots=0
assistant=0
banks=0
; LikeSpa instance overlays (term scans, promoter bonus, dops on /audio/calendar):
likespa=0
; Public storefront runtime (site.php) + theme — enable with catalog/orders/clients as needed:
sites=0
; Self-update UI (/updates) — engine lives in app/UpdateEngine.php:
updates=1
; Terminals / therms (devices, bracelets, occupancy + 1C sync):
terminals=0
; Staff quality day reports (traffic lights; rewards on /audio/calendar):
staff_reports=0
; Personal health & fitness (food diary, weight, workouts, health logs):
wellness=0
; Incomplete WIP modules (keep off until ready):
liquid_assets=0
; External CRM pull integrators (YClients / Clientics — enable after schema migrate + tokens):
yclients=0
clientics=0


; Product module settings live in cfg/modules/<id>.ini (gitignored).
; Copy modules/<id>/config.example.ini → cfg/modules/<id>.ini as needed.
; See modules/audio|calendar|ledger/config.example.ini.
