[connect]
host="127.0.0.1"
socket=""
user_db="root"
pass_db="secret"
dbase="likespa"
sitename="FreeSaaS"

[app]
name="FreeSaaS"
; Fallback under the logo / tab title when base_system.company is empty (edit Company in Settings).
instance="Demo"
timezone="UTC"
locale="ru"

[salts]
cookie="CHANGE_ME_COOKIE_SALT"
site="CHANGE_ME_SITE_SALT"

[modules]
core=1
comments=1
contracts=1
clients=1
units=1
suppliers=1
cabinets=1
catalog=1
procedures=1
orders=1
workweeks=1
calendar=1
stocks=1
stickers=1
norms=1
sheets=0
tables=0
rates=1
vacations=1
payments=1
procents=1
ledger=1
funds=1
finance=1

[ledger]
; NAME match for payments → ДПС (ФОТ). Override if types renamed in DB.
fot_bank_type="ФОТ"
fot_cash_type="ФОТ Нал"
fot_cash_transfer_type="ФОТ РФ"

[calendar]
; Timeline fallback if base_system.work_hour_* missing (see Settings when calendar is on).
hour_start=9
hour_end=21
; 1 = allow «New event» / click-to-create in calendar UI (also needs EVT_CREATE_NEW).
; 0 = events only from terminals / external sources (LikeSpa).
manual_create=1
