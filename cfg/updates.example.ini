; Self-update sources (copy → cfg/updates.ini; gitignored).
; Tokens are instance secrets — never commit. Same threat class as app.agent_token.
;
; Prefer freesaas-catalog.json on the registry release (built by bin/build-release-artifacts.sh):
; {
;   "channel": "stable",
;   "packages": [
;     {"id":"core","kind":"core","version":"0.3.1","artifact":"freesaas-core-0.3.1.zip","sha256":"…"},
;     {"id":"banks","kind":"module","version":"0.2.0","artifact":"freesaas-module-banks-0.2.0.zip","sha256":"…"}
;   ]
; }
; Core zip is platform-only; product modules update independently by their own version.
; Compat: single-package freesaas-manifest.json still works (core-only).
;
; Providers:
;   github — GitHub Releases API (repo=owner/name). Prefers asset named `asset`,
;            else freesaas-manifest.json + matching zip, else zipball of the tag.
;   http   — fetch `manifest_url` (JSON with url+sha256+version).
;
; channel: stable|latest → latest non-prerelease; or exact tag name (v0.3.1).

[core]
provider = github
repo = example/freesaas
channel = stable
; token =
; asset = freesaas-core.zip
; Prefer release assets built by bin/build-release-artifacts.sh

; Example direct HTTP (CDN / own host):
; [core]
; provider = http
; manifest_url = https://releases.example.com/freesaas/stable/manifest.json
; token =

; Private product module (not in public core zip):
; [module.likespa]
; provider = github
; repo = example/likespa-module
; token = ghp_xxx
; channel = stable
; path_prefix =
; ; If the zip root IS the module tree (module.json at zip root), leave path_prefix empty.
; ; If the zip is a monorepo slice, set path_prefix = modules/likespa
;
; Modules may declare a public hint in module.json:
;   "update": { "repository": "https://github.com/org/likespa-private", "channel": "stable" }
; The Updates UI lists them as candidates. Check/Apply only work after a matching
; [module.<id>] section exists here (with token for private repos).
