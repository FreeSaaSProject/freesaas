; Self-update (copy → cfg/updates.ini; gitignored).
; Tokens are instance secrets — never commit.
;
; Check reads modules/<id>/module.json → version from the git ref
; (GitHub Contents API — ~1 request per module; fine with a token).
; Apply: snapshot touched files → overlay → migrate → health (ok requires health).
; On failure: restore files; optional DB dump/restore if enabled below.
;
; channel:
;   main|master|<branch>  — floating; zipball of that ref
;   stable|latest         — GitHub latest release tag + optional full zip asset
;   v0.3.2                — exact tag
; ref=                    — optional override of the git ref used for check/apply

[updates]
; Full DB dump before migrate + restore on migrate failure. Default 0 (slow on large tables).
db_backup_before_migrate = 0

[core]
provider = github
repo = FreeSaaSProject/freesaas
channel = main
; token =                    ; GitHub PAT/fine-grained with contents:read (private deps) or public repo
; asset = freesaas-0.3.33.zip   ; optional: named full zip on a Release (stable)

; Instance storefront themes are NOT updated from this monorepo.
; LikeSpa branding lives in private repo ilcommm/freesaas-theme-likespa
; (clone/sync into themes/likespa/ on the host; gitignored in public freesaas).

; External / private module from another repo (optional):
; [module.x]
; provider = github
; repo = example/some-module
; token = ghp_xxx
; channel = main
; path_prefix =
; ; empty path_prefix = zip root is the module tree (module.json at root)
