; Self-update (copy → cfg/updates.ini; gitignored).
; Tokens are instance secrets — never commit.
;
; Check reads VERSION + each modules/<id>/module.json from the git ref
; (GitHub Contents API — ~1 request per module; fine with a token).
; Apply downloads ONE archive for the monorepo (zipball of ref, or a single
; full release zip for channel=stable). External modules use [module.id].
;
; channel:
;   main|master|<branch>  — floating; zipball of that ref
;   stable|latest         — GitHub latest release tag + optional full zip asset
;   v0.3.2                — exact tag
; ref=                    — optional override of the git ref used for check/apply

[core]
provider = github
repo = example/freesaas
channel = main
; token =
; asset = freesaas-0.3.2.zip   ; optional: named full zip on a Release (stable)

; External / private module from another repo (optional):
; [module.likespa]
; provider = github
; repo = example/likespa-module
; token = ghp_xxx
; channel = main
; path_prefix =
; ; empty path_prefix = zip root is the module tree (module.json at root)
