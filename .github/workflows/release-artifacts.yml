name: Release artifacts

# Builds one full FreeSaaS zip (+ freesaas-manifest.json) and attaches to the GitHub Release.
# PRIVATE_MODULES — modules omitted from zip (empty = ship all, incl. likespa).
# PRIVATE_THEMES — storefront themes omitted (default likespa; never drop themes/default).
# Requires CI (ci.yml) green on the released commit before upload.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      private_modules:
        description: 'Comma-separated modules excluded from the full zip (empty = none)'
        required: false
        default: ''
      private_themes:
        description: 'Comma-separated themes excluded from the full zip'
        required: false
        default: 'likespa'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Require CI green on release commit
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Checking CI for commit $sha"
          conclusion="$(gh run list --workflow=ci.yml --commit="$sha" \
            --status=completed --limit=1 --json conclusion -q '.[0].conclusion // empty')"
          if [[ "$conclusion" != "success" ]]; then
            echo "::error::CI not green for $sha (got: ${conclusion:-none}). Refusing to publish artifacts."
            exit 1
          fi
          echo "CI green for $sha"

      - name: Build full zip
        env:
          PRIVATE_MODULES: ${{ github.event.inputs.private_modules }}
          PRIVATE_THEMES: ${{ github.event.inputs.private_themes || 'likespa' }}
          RELEASE_REF: ${{ github.sha }}
        run: |
          chmod +x bin/build-release-artifacts.sh
          # Pin archive to the checked-out commit (matches tag for release events).
          RELEASE_REF="$(git rev-parse HEAD)"
          export RELEASE_REF
          bin/build-release-artifacts.sh
          ls -la dist/
          test -f dist/freesaas-manifest.json
          # Instance theme must not ship in public artifacts
          ! unzip -l dist/freesaas-[0-9]*.zip | grep -q 'themes/likespa/'
          # Local secrets must not ship
          ! unzip -l dist/freesaas-[0-9]*.zip | grep -E -q '(^|/)\.env|/dumps/|\.sql$'

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/freesaas-[0-9]*.zip
            dist/freesaas-manifest.json
            dist/freesaas-catalog.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freesaas-release-dist
          path: dist/
