name: CI

# Static checks on every push/PR; install job catches MariaDB/MySQL blockers (B1/B2).
# Actions pinned to commit SHAs (mutable tags alone are not enough).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # Official gitleaks-action requires a paid GITLEAKS_LICENSE for org repos.
      # Run the open-source CLI instead (same detector, no org license).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks
        run: gitleaks detect --source . --verbose --redact

  cla:
    name: CLA gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require CLA for external contributors
        env:
          ASSOC: ${{ github.event.pull_request.author_association }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          echo "author=$AUTHOR association=$ASSOC labels=$LABELS"
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "OK maintainer association — CLA not required"; exit 0 ;;
          esac
          # Bots (Dependabot, GitHub Actions) are not human contributors — no CLA.
          if [ "$AUTHOR" = 'dependabot[bot]' ] || [ "$AUTHOR" = 'github-actions[bot]' ]; then
            echo "OK bot author — CLA not required"
            exit 0
          fi
          # External PRs: maintainer applies label after CLA.md acceptance (email).
          if echo ",$LABELS," | grep -qi ',cla-signed,'; then
            echo "OK label cla-signed present"
            exit 0
          fi
          echo "::error::External PR needs an accepted CLA (see CLA.md / CONTRIBUTING.md)."
          echo "Maintainer: after CLA acceptance, add label \`cla-signed\`."
          exit 1

  static:
    name: static (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.4']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Config from example (all modules on)
        run: |
          cp cfg/config.example.ini cfg/config.ini
          php -r '
          $ini = parse_ini_file("cfg/config.ini", true, INI_SCANNER_RAW);
          if (!is_array($ini)) { fwrite(STDERR, "bad ini\n"); exit(1); }
          $ini["connect"]["host"] = "127.0.0.1";
          $ini["connect"]["user_db"] = "ci";
          $ini["connect"]["pass_db"] = "ci";
          $ini["connect"]["dbase"] = "ci";
          $ini["app"]["agent_token"] = "ci-static-agent-token";
          foreach (glob("modules/*/module.json") as $f) {
            $ini["modules"][basename(dirname($f))] = "1";
          }
          $out = "";
          foreach ($ini as $sec => $vals) {
            $out .= "[" . $sec . "]\n";
            foreach ($vals as $k => $v) { $out .= $k . "=" . $v . "\n"; }
            $out .= "\n";
          }
          file_put_contents("cfg/config.ini", $out);
          '

      - name: PHP lint
        run: |
          set -euo pipefail
          find app bin modules -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 php -l >/tmp/php-l.txt
          if grep -E -i 'parse error|fatal error|errors parsing' /tmp/php-l.txt; then
            exit 1
          fi
          echo "php -l ok ($(wc -l < /tmp/php-l.txt) files)"

      - name: strict_types guard (non-vendor)
        run: |
          set -euo pipefail
          : > /tmp/no-strict.txt
          while IFS= read -r f; do
            case "$f" in */vendor/*|*/phpqrcode/*) continue ;; esac
            grep -q 'declare(strict_types=1)' "$f" || echo "$f" >> /tmp/no-strict.txt
          done < <(git ls-files '*.php')
          if [ -s /tmp/no-strict.txt ]; then
            echo "Missing declare(strict_types=1) in:"
            cat /tmp/no-strict.txt
            exit 1
          fi
          echo "strict_types ok (all first-party tracked PHP)"

      - name: Module validate
        run: php bin/module-validate.php --format=json

      - name: i18n check
        run: php bin/check-i18n.php --format=json

      - name: Security helper checks
        run: |
          php bin/check-safe-html.php
          php bin/check-csrf.php
          php bin/check-password.php
          php bin/check-session.php
          php bin/check-unserialize.php
          php bin/check-htaccess-denies.php
          php bin/check-safe-http.php
          php bin/check-license-inventory.php

      - name: Public route allow-list
        run: php bin/check-routes.php

      - name: Semgrep PHP security (SAST)
        if: matrix.php == '8.2'
        run: |
          set -euo pipefail
          python3 -m pip install --user 'semgrep==1.110.0'
          export PATH="$HOME/.local/bin:$PATH"
          # Focused ruleset (.semgrep.yml). Full p/php is too noisy on JSON APIs /
          # ListQuery ORDER BY allow-lists / intentional SSL toggles — covered by
          # bin/check-unserialize.php, check-safe-http.php, check-csrf.php, etc.
          semgrep scan \
            --config .semgrep.yml \
            --error \
            --metrics=off \
            --exclude='modules/**/vendor/**' \
            --exclude='modules/**/phpqrcode/**' \
            --exclude='var/**'

  install:
    name: install (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mariadb:10.11
            php: '8.2'
            artifact: mariadb-10.11
          - db: mysql:8.0
            php: '8.2'
            artifact: mysql-8.0
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: freesaas
          MYSQL_USER: freesaas
          MYSQL_PASSWORD: freesaas
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none

      - name: Config + enable all modules
        run: |
          cp cfg/config.example.ini cfg/config.ini
          php -r '
          $ini = parse_ini_file("cfg/config.ini", true, INI_SCANNER_RAW);
          $ini["connect"]["host"] = "127.0.0.1";
          $ini["connect"]["user_db"] = "freesaas";
          $ini["connect"]["pass_db"] = "freesaas";
          $ini["connect"]["dbase"] = "freesaas";
          $ini["app"]["agent_token"] = "ci-install-agent-token";
          $mods = [];
          foreach (glob("modules/*/module.json") as $f) {
            $id = basename(dirname($f));
            $ini["modules"][$id] = "1";
            $mods[] = $id;
          }
          $out = "";
          foreach ($ini as $sec => $vals) {
            $out .= "[" . $sec . "]\n";
            foreach ($vals as $k => $v) { $out .= $k . "=" . $v . "\n"; }
            $out .= "\n";
          }
          file_put_contents("cfg/config.ini", $out);
          file_put_contents("/tmp/freesaas-all-modules.txt", implode(",", $mods));
          echo "modules=" . count($mods) . "\n";
          '

      - name: Bootstrap
        run: |
          MODS=$(cat /tmp/freesaas-all-modules.txt)
          php bin/freesaas.php bootstrap \
            --login=ciadmin \
            --password='CiTestPass1!' \
            --name='CI Admin' \
            --agent-token='ci-install-agent-token' \
            --modules="$MODS" \
            --format=json

      - name: Migrate run (idempotent second pass)
        run: |
          set -euo pipefail
          php bin/freesaas.php migrate run --format=json | tee /tmp/mig1.json
          php -r '$j=json_decode(file_get_contents("/tmp/mig1.json"),true); if(empty($j["ok"])){fwrite(STDERR,"migrate1 not ok\n"); exit(1);} echo "applied1=".($j["applied"]??"?")."\n";'
          php bin/freesaas.php migrate run --format=json | tee /tmp/mig2.json
          php -r '
          $j=json_decode(file_get_contents("/tmp/mig2.json"),true);
          if(empty($j["ok"])){fwrite(STDERR,"migrate2 not ok\n"); exit(1);}
          $a=(int)($j["applied"]??-1);
          if($a!==0){fwrite(STDERR,"expected applied===0 on second migrate, got $a\n"); exit(1);}
          echo "applied2=0 ok\n";
          '

      - name: Health (no fail)
        run: |
          php bin/freesaas.php health --format=json | tee /tmp/health.json
          php -r '
          $j=json_decode(file_get_contents("/tmp/health.json"),true);
          $st=(string)($j["status"]??"");
          if($st==="fail"){fwrite(STDERR,"health status=fail\n"); exit(1);}
          echo "health status=$st\n";
          '

      - name: Smoke
        run: php bin/smoke.php --format=json

      - name: Auth / CSRF / permission / path-deny gates
        run: |
          set -euo pipefail
          # PHP built-in server ignores .htaccess — sensitive path denies are static-checked.
          # Public-route allow-list + CSRF/session helpers cover IDOR/CSRF control surfaces.
          php bin/check-csrf.php
          php bin/check-session.php
          php bin/check-routes.php
          php bin/check-htaccess-denies.php
          php bin/check-safe-http.php
          php bin/check-http-perms.php
          php -r '
          require "app/bootstrap.php";
          $tok = (string)Config::get("app", "agent_token", "");
          if ($tok === "" || $tok === "CHANGE_ME") { fwrite(STDERR, "agent_token unset\n"); exit(1); }
          echo "OK agent_token configured for install\n";
          '

      - name: SBOM inventory artifact
        run: |
          mkdir -p var
          php bin/check-license-inventory.php
          test -f var/sbom-inventory.json || echo '{"bomFormat":"CycloneDX","components":[]}' > var/sbom-inventory.json

      - name: Upload SBOM inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-inventory-${{ matrix.artifact }}
          path: var/sbom-inventory.json
          if-no-files-found: warn

      - name: Round-trip CLI (auth / bots)
        run: |
          set -euo pipefail
          php bin/freesaas.php user hash-audit --format=json
          php bin/freesaas.php user login-link ciadmin --ttl=15 --format=json
          php bin/freesaas.php bot link-code ciadmin --ttl=600 --format=json
          php bin/freesaas.php bot unlink ciadmin --format=json || true
          php bin/freesaas.php user logout-all ciadmin --format=json
