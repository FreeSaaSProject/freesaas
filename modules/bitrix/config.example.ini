; Bitrix24 CRM bridge — copy to cfg/modules/bitrix.ini
[bitrix]
pull_enabled = 1
push_enabled = 1
; Portal host without scheme, e.g. example.bitrix24.ru
portal = 
; Incoming webhook or app REST path, e.g. https://example.bitrix24.ru/rest/1/xxxxx/
rest_url = 
webhook_token = CHANGE_ME
worker_token = CHANGE_ME
timeout_sec = 30
page_size = 50
; Max rows per import run and entity (0 = no limit). Hourly cron pulls only rows changed since the last complete run.
max_records = 10000
; One local pipeline per Bitrix deal funnel (+ one for leads) with Bitrix stage names/semantics. 0 = legacy single pipeline.
map_pipelines = 1
; Import contacts that have e-mail but no phone (phone is the client identity, so off by default).
contacts_without_phone = 0
