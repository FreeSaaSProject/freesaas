; Bitrix24 CRM bridge — copy to cfg/modules/bitrix.ini
[bitrix]
pull_enabled = 1
push_enabled = 1
; Portal host without scheme, e.g. example.bitrix24.ru
portal = 
; Incoming webhook or app REST path, e.g. https://example.bitrix24.ru/rest/1/xxxxx/
rest_url = 
webhook_token = CHANGE_ME
worker_token = CHANGE_ME
timeout_sec = 30
page_size = 50
