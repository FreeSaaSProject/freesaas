[sites]
; Fallback theme if base_site_hosts is empty (prefer /sites/hosts in admin)
theme=default
; Legacy single public host — seed only; multi-domain lives in base_site_hosts
; public_host=www.example.com
; Admin host for /login redirect from storefront (still global)
; admin_host=admin.example.com
; Storefront cart lead before first slot today (seconds). Default 10 min.
booking_lead_sec=600
; Slot grid (minutes): 5, 10, 15, 20, 30 — UI on /calendar/settings
booking_slot_interval_min=15

; Fallback SEO / contacts when the host or promo page has none (UI: /sites/seo).
seo_name=
seo_title=
seo_keywords=
tel=
