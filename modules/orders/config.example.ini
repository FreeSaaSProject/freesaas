; Copy to cfg/modules/orders.ini (gitignored).

[orders]
; Max-group notify via bots queue (base_telegram_sends). Needs bots + staff_max_token.
max_notify_enabled=0
; Max group chat_id (negative). Legacy likespa [max_bot] chat_id.
max_notify_chat_id=
; Optional title overrides (otherwise i18n orders.max_notify.title_new / title_cancel).
max_notify_title=
max_notify_title_cancel=
; On EventBus orders.client.arrived (any channel: terminals /t, bots, …):
; transition matching orders for that client_id (ID_USER).
arrive_transition_enabled=0
; DB STATUS to find / to set (editableStatuses codes).
arrive_match_status=cashComplete
arrive_set_status=complete
; ± seconds around now for DT_EVENT_NEW (min 3600, max 604800). Default 10800 (3h).
arrive_window_sec=10800
