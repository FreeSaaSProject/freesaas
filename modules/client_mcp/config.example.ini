; Copy to cfg/modules/client_mcp.ini (gitignored).
; Per-host on/off, name, description, consent link and tools: /client-mcp/settings (base_client_mcp_hosts).

[client_mcp]
; New clients (phone not in base_clients) must give a name.
require_name_for_new=1
; ISO 4217 currency code reported to agents.
currency=RUB
; Abuse limits (all hosts).
sessions_per_ip_hour=20
bookings_per_phone_day=3
token_ttl_hours=24
