; Copy to cfg/modules/assistant_groups.ini (gitignored).
; Dedicated Max bot for group assistant (do not reuse production staff token lightly).

[assistant_groups]
; Max bot access token (platform-api2.max.ru). Leave empty to use bots staff_max_token instead.
max_token =
; 1 = process group mentions for allowlisted chats
group_enabled = 0
; Require @botusername (or bot user_id mention) before handling
group_require_mention = 1
; Comma-separated Max group chat_ids (negative ids), e.g. -80245290599809
; Prefer catching bot_added (settings «Discovered») — Max has no list-my-chats for bots.
group_chat_ids =
; Optional JSON map chat_id → {title, description} for bot context + recipients UI
; Example: {"-8024…":{"title":"Managers","description":"Shift and rate questions"}}
group_chat_meta =
; 1 = on bot_added / first sight, append chat_id to group_chat_ids automatically
auto_add_groups = 0

; Comma-separated agent.ops ids allowed in groups (exact or module.*). Others → «only in private».
; Blocks = calendar.events.create with is_block=1 (same create op). Prefer workweeks.* so
; create/update/delete stay in sync (remove/replace shift needs update+delete, not create alone).
; Example:
group_ops = workweeks.*,calendar.day,calendar.events.get,calendar.events.create,calendar.events.update,calendar.events.delete,rates.skill.*,core.users.list
; Generated on «Subscribe webhook» (A-Z a-z 0-9 _ -). Do not commit real secrets.
webhook_secret =
; 1 after successful Max POST /subscriptions (disables long-poll cron)
webhook_subscribed = 0
