; Copy to cfg/modules/banks.ini (gitignored).

[banks]
; Default ledger move type when LLM is off / uncertain (ID from base_account_move_types)
default_move_type_id=0

; Shared secret for /banks/jobs/* (header X-Banks-Token or ?token=)
worker_token="CHANGE_ME"

; --- Tochka Open Banking ---
tochka_client_id=
tochka_client_secret=
tochka_redirect_uri=
; scopes string for authorize / token
tochka_scope="accounts balances customers statements"
tochka_api_base="https://enter.tochka.com/uapi"
tochka_auth_base="https://enter.tochka.com"
; 1 = use sandbox base + sandbox.jwt.token (no OAuth)
tochka_sandbox=0

; --- Alfa API (legal entity / business) ---
alfa_ul_client_id=
alfa_ul_client_secret=
alfa_ul_redirect_uri=
alfa_ul_scope="openid profile email"
alfa_ul_auth_base="https://id.alfabank.ru"
alfa_ul_token_url="https://baas.alfabank.ru/oidc/token"
alfa_ul_api_base="https://baas.alfabank.ru"

; --- Alfa Open Banking (individuals / PE) ---
alfa_fl_client_id=
alfa_fl_client_secret=
alfa_fl_redirect_uri=
alfa_fl_scope="openid obru_accounts_pe"
alfa_fl_auth_base="https://id.alfabank.ru"
alfa_fl_token_url="https://baas.alfabank.ru/oidc/token"
alfa_fl_api_base="https://baas.alfabank.ru"

; --- T-Bank / Tinkoff Business (ЮЛ) ---
; Prefer self-service token from T-Business cabinet, OR partner T-ID OAuth:
tbank_ul_access_token=
tbank_ul_client_id=
tbank_ul_client_secret=
tbank_ul_redirect_uri=
tbank_ul_scope="opensme/inn/0/kpp/0/bank-accounts/get opensme/inn/0/kpp/0/bank-statements/get"
tbank_ul_auth_base="https://id.tbank.ru"
tbank_ul_token_url="https://id.tbank.ru/auth/token"
tbank_ul_api_base="https://business.tbank.ru/openapi"

; --- T-Bank individuals (ФЛ) via T-ID ---
tbank_fl_client_id=
tbank_fl_client_secret=
tbank_fl_redirect_uri=
tbank_fl_scope="opensme/individual/accounts/debit/get"
tbank_fl_auth_base="https://id.tbank.ru"
tbank_fl_token_url="https://id.tbank.ru/auth/token"
tbank_fl_api_base="https://business.tbank.ru/openapi"

; --- Sber Business (ЮЛ / ИП) via СберБизнес ID ---
; Production hosts often need mTLS client cert on the host; adjust URLs per partner docs.
sber_ul_client_id=
sber_ul_client_secret=
sber_ul_redirect_uri=
sber_ul_scope="openid GET_STATEMENT_ACCOUNT GET_CLIENT_ACCOUNTS"
sber_ul_auth_base="https://sbi.sberbank.ru:9443"
sber_ul_token_url="https://fintech.sberbank.ru:9443/ic/sso/api/v2/oauth/token"
sber_ul_api_base="https://fintech.sberbank.ru:9443"

; --- Sber personal (ФЛ) Open Banking PE ---
; Public portal documents Business first; fill bases after partner PE access is issued.
sber_fl_client_id=
sber_fl_client_secret=
sber_fl_redirect_uri=
sber_fl_scope="openid obru_accounts_pe"
sber_fl_auth_base=
sber_fl_token_url=
sber_fl_api_base=
sber_fl_authorize_path="/oauth/authorize"
