; Copy to cfg/modules/llm.ini (gitignored). Manage profiles via /llm/tokens UI.
[llm]
default_profile = main
; Public site origin for OAuth/MCP endpoint URLs (no trailing slash). Empty = auto from request Host.
; public_base = https://crm.example.com
