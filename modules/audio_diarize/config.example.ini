; Copy to cfg/modules/audio_diarize.ini (gitignored).
; Module enable/disable is via [modules] audio_diarize=1 — not this file.

[audio_diarize]
; When 1, full-file diarize waits until ready voice profiles exist (recommended).
requires_profiles=1
; When 1, CollectRunner does not credit scripts if the cue speaker matched another staff.
; Keys/instances stay; re-run collect/Re-® after changing.
scripts_ignore_other_speakers=1
; Cue→staff cosine gate (edge worker reads via /audio/asr/diarize-status). Soft trial 0.45.
match_cue=0.45
; Min (top1 − top2); 0 = off.
match_margin=0
; Minutes before/after workweeks shift window still send that staff profile to ASR-DIA match.
match_shift_gap_min=45
