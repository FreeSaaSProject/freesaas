; Copy to cfg/modules/backups.ini (gitignored). Do not commit secrets.

[backups]
enabled=0
daily_at=03:30
keep_remote=7
keep_local=1
db_scope=owned
; Comma-separated source ids from backups.sources (db and cfg always on when listed here)
sources=db,cfg,userfiles,uploads,themes
instance=
ftp_host=
ftp_port=21
ftp_user=
ftp_pass=
ftp_ssl=0
ftp_passive=1
ftp_base_path=/freesaas-backups
encrypt=0
passphrase=
notify_ui=1
notify_bots=0
notify_on_fail=1
notify_on_success=0
notify_on_stale=1
notify_stale_hours=48
notify_staff_ids=
notify_chat_id=
notify_platform=max
last_stale_notified_at=0
