; Copy to cfg/modules/backups.ini (gitignored). Do not commit secrets.

[backups]
enabled=0
daily_at=03:30
; Nightly light pack after daily_at: db + cfg only (default on)
light_nightly=1
keep_light=7
; Hard full with optional file sources (video/audio/uploads…) — default off
hard_enabled=0
; Hard full at most every N days (still gated by daily_at); only if hard_enabled=1
full_every_days=7
keep_remote=7
keep_local=1
; CDC-lite hourly packs (requires triggers — Install CDC in UI)
cdc_enabled=0
; differential = each pack = all changes since last light/full (restore: baseline + latest)
; chain = classic slices (restore: baseline + unbroken s001…sNNN on FTP)
incr_mode=differential
incr_every_hours=1
; Keep newest CDC packs (.diff.sNNN / .incr.sNNN). Differential usually needs only a few.
keep_incr=48
; Extra tables to skip (comma). Defaults already exclude fullstats/caches/cron/backup_*
cdc_exclude=
db_scope=owned
; Sources for hard full only (light always uses db+cfg). Keep lean by default.
sources=db,cfg
instance=
ftp_host=
ftp_port=21
ftp_user=
ftp_pass=
ftp_ssl=0
ftp_passive=1
ftp_base_path=/freesaas-backups
encrypt=0
passphrase=
notify_ui=1
notify_bots=0
notify_on_fail=1
notify_on_success=0
notify_on_stale=1
notify_stale_hours=48
notify_staff_ids=
notify_chat_id=
notify_platform=max
last_stale_notified_at=0
; Test-copy replica (manual pull of the primary's latest light/full + diff; DB only).
; Never enable on the primary: «Pull and apply» drops this host's base_* tables.
replica_enabled=0
replica_instance=
replica_ftp_host=
replica_ftp_port=21
replica_ftp_user=
replica_ftp_pass=
replica_ftp_ssl=0
replica_ftp_passive=1
replica_ftp_base_path=/freesaas-backups
replica_passphrase=
