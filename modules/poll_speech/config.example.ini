; Copy to cfg/modules/poll_speech.ini (gitignored).

[poll_speech]
; Show “review asked” button on calendar procedure chips.
oral_btn_enabled=1
; Root poll for oral marks (10-point oral poll). Synced to poll_invites.oral_poll_id on save.
oral_poll_id=0
; audio_dicts dictionary with ask + guest score phrases (instance default: 50 «Отзывы 10»).
dict_id=50
; Seconds around oral mark time (invite DT_CREATE) to search key instances (±15 min default).
window_sec=900
; Whose cabin audio: linked | proc_admin | both
; Prefer both/proc_admin — oral mark is often clicked by a supervisor (linked), while ASR is on the floor admin.
admin_field=both
; JSON object: key_id → score 1..10 (ask phrases omitted).
; Example: {"5001":10,"5002":9}
key_score_map={}
; Rating question ids filled with the same spoken score (comma-separated).
qid_staff=0
qid_service=0
; Answer ids for scores 1..10 on staff question (comma-separated, length 10).
answers_staff=
; Answer ids for scores 1..10 on service question (comma-separated, length 10).
answers_service=
