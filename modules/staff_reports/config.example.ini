[staff_reports]
; Quality ticket publisher (day reports after collect / Re-® / day-report).
require_full_parse="1"
; 1 = allow Re-® / generate for today (comment upserts). 0 = past days only.
allow_same_day_publish="0"
managing_contract_id="0"
ticket_status_id="4"
ticket_title_prefix="[Отчеты:"
ticket_default_body="Здесь формируются отчёты по работе"
; Fixed news/ticket id for monthly gratitude board (0 = skip). Other staff tickets are auto-created.
gratitude_news_id="0"
; Working days until reward contract deadline (PRICE_OFFER under day report).
contract_working_days="5"
llm_enabled="0"
