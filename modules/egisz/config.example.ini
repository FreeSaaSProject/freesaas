; Copy to cfg/modules/egisz.ini (gitignored).
; Demo needs OpenVPN (.ovpn from N3); do not commit real GUID/tokens.

[egisz]
; Operator id: none | n3 | medflex | medme | gigtest
operator=none
; Medical organization OID from FRMO (required for SEMD metadata)
mo_oid=
; Optional territorial unit / TVSP OID
department_oid=
department_name=
; Document type OIDs (NSI 1.2.643.5.1.13.13.11.1520) — override when editions change
semd_consult_oid=10.0.0.4.172.16.1.5.2.227
semd_manip_oid=10.0.0.4.172.16.1.5.2.283

; --- N3.Health IEMK ---
; demo | prod
n3_env=demo
; Auth token (GUID) and LPU id from N3
n3_guid=
n3_id_lpu=
; Optional Eventlog API token (if issued separately)
n3_eventlog_token=
; Demo SOAP / REST endpoints (override for prod)
n3_emk_url=http://b2b-demo.n3health.ru/emk/EMKService.svc
n3_pix_url=http://b2b-demo.n3health.ru/emk/PixService.svc
n3_term_url=http://b2b-demo.n3health.ru/nsi/fhir/term/
n3_eventlog_url=https://api.n3health.ru/eventlog/
n3_fnsi_url=https://api.n3health.ru/fnsi/

; Edge Mac worker (OpenVPN + workers/plugins/egisz). Off by default.
; Enable on demomed when PHP host has no VPN: worker_enabled=1 + token.
; Disable anytime: worker_enabled=0 and/or remove "egisz" from host.local.json enabled_plugins.
worker_enabled=0
worker_token=
