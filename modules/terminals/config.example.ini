; Copy to cfg/modules/terminals.ini (gitignored).

[terminals]
; Feature toggles
registry_enabled=1
analytics_enabled=1
sync_enabled=1

; 1C club API (was phpshop_system.1C_* + 1C_ENABLED)
; 1c_enabled=0 → stub/debug on /t and sale/unsale (no HTTP). 1c_enabled=1 requires url+auth+apikey+terminal or /t errors.
1c_enabled=1
; Header "apikey:" — instance secret from 1C / ops. Never put real values in git.
1c_url=
1c_auth=
1c_apikey=
1c_terminal=
1c_uid=
1c_timeout_sec=30

; Shared secret for /terminals/jobs/* (header X-Terminals-Token or ?token=)
worker_token="CHANGE_ME"

; Defaults for future bot/booking callers (was oper telegram_bot)
booking_terminal_id=
booking_admin_id=

; Slot lead (seconds): /t floor = 3 min; agent /terminals/floor = 10 min
lead_sec=180
lead_sec_api=600
; Slot grid (minutes): 5, 10, 15, 20, 30 — UI on /calendar/settings
slot_interval_min=15
; Chill/rest procedure product id (legacy ID_GOOD=16); 0 = disable chill insert
chill_product_id=16
; Floor /t may book past staff shift (PRICE_COL) end — still on roster + salon hours.
; Site, legacy API and MCP never ignore staff shift windows.
ignore_staff_shift_windows=1
