; Copy to cfg/modules/terminals.ini (gitignored).

[terminals]
; Feature toggles
registry_enabled=1
analytics_enabled=1
sync_enabled=1

; 1C club API (was phpshop_system.1C_* + hardcoded apikey in oper gens)
1c_url=
1c_auth=
1c_apikey=
1c_terminal=
1c_uid=
1c_timeout_sec=30

; Term ticket orders import (was hardcoded https://volgatermy.ru/vtorders/)
orders_url="https://volgatermy.ru/vtorders/"

; Shared secret for /terminals/jobs/* (header X-Terminals-Token or ?token=)
worker_token="CHANGE_ME"

; Defaults for future bot/booking callers (was oper telegram_bot)
booking_terminal_id=
booking_admin_id=
