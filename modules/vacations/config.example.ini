; Copy to cfg/modules/vacations.ini (gitignored).

[vacations]
; Group remind via bots queue (base_telegram_sends). Needs bots + staff Max/Telegram token.
remind_enabled=0
; Days before DT_START (CSV). Example: 5 or 7,3,1
remind_days_before=5
; Cron daily_at HH:MM (local server time).
remind_daily_at=09:00
; Group chat_id (Max usually negative). Same id as in assistant_groups /bots recipients is fine.
remind_chat_id=
; max | telegram
remind_platform=max
; Optional message override. Placeholders: {acronym} {name} {start} {end} {days}
; Empty = i18n vacations.remind.message
remind_message=
; ID_TYPE filter CSV (1 paid, 2 unpaid, 3 working period). Default skips working period.
remind_types=1,2
; Only SHOW_USER=1 rows
remind_show_user_only=1
