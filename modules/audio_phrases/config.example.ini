; Copy to cfg/modules/audio_phrases.ini (gitignored).

[audio_phrases]
; Sliding window size (words / lemmas).
words=3
; Min occurrences in a day+admin to keep a phrase candidate.
min_instances=3
; Context words around the hit for EXAMPLE.
delta_surround=3
; Daily cron time HH:MM (server local).
daily_at=03:40
; Re-process this many past days on each daily tick (catch-up).
backfill_days=3
; After calendar Re-® / day reparse, also harvest top-phrases (1=on, 0=off).
with_reparse=1
; Mirror of Cron job audio_phrases.daily enabled flag (UI also writes base_cron_job_state).
cron_enabled=1
; Extra stopwords (comma-separated lemmas) auto-marked junk when combo is only these.
stopwords=
