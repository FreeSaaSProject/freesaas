; Copy to cfg/modules/demo.ini (gitignored). Demo stands only (app.demo_readonly=1).

[demo]
; Stand identity. Seed refuses unless base_demo_stand marker in this DB has the same id.
; A fresh DB (no clients/events/news) is claimed automatically on first seed.
stand_id = "demoru"

; Banner link to the sibling stand in the other language (empty = no link).
switch_url_ru = "https://demoru.example.com/"
switch_url_en = "https://demoen.example.com/"

; --- Code update (cron demo.update) ---
; 1 = stand pulls code itself via UpdateEngine (cfg/updates.ini required).
update_enabled = 0
; all = whole code (default, versions stay consistent);
; demo = seed module only — auto-escalates to all when a module the seed depends on has an update.
update_target = "all"
; Exact daily time HH:MM (app.timezone) …
update_at = "03:00"
; … or an interval in minutes (>0 overrides update_at; min 15).
update_every_min = 0

; --- Reseed (cron demo.reseed) ---
; Exact daily time HH:MM …
reseed_at = "03:15"
; … or an interval in minutes (>0 overrides reseed_at; min 30).
reseed_every_min = 0

; --- Reseed after code update (cron demo.version_check) ---
; 1 = reseed as soon as modules/demo/module.json version differs from the last seeded one.
reseed_on_version = 1
; How often to compare versions, minutes (min 5).
version_check_every_min = 15

; Keep this many pre-reseed DB dumps (var/db_dumps) for rollback; min 1.
keep_dumps = 3
