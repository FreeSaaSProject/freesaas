[video]
; Shared secret for Mac video worker (header X-Video-Token or ?token=).
worker_token="CHANGE_ME"
; Retention for monitoring frames (not alert attachments).
retention_days=7
; Hard cap on monitoring media under var/video (MB). 0 = unlimited (not recommended).
max_storage_mb=2048
; Keep alert event media when purging.
keep_alert_media=1
; Latest-frame ring per camera (annotated JPEGs kept for live UI).
latest_frame_ring=3
; Aggressive preset: purge all non-alert monitoring media after retention_days=0 effectively only alerts.
purge_mode=default
