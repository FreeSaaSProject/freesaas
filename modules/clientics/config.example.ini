; Copy to cfg/modules/clientics.ini (gitignored).
; Dual-run bridge: pull + optional push. Appointment SoT avoids double-booking.

[clientics]
pull_enabled=1
push_enabled=0
; clientics = create visits in Clientics, FreeSaaS mirrors
; freesaas  = create visits in FreeSaaS calendar, outbox pushes to Clientics
appointment_sot=clientics
; Fallback staff id when Clientics executor is not mapped (0 = skip)
default_operator_id=0
domain="klientiks.ru"
account_id=
user_id=
access_token=
timeout_sec=30
page_limit=100
worker_token="CHANGE_ME"
webhook_token="CHANGE_ME"
