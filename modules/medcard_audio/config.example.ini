; Copy to cfg/modules/medcard_audio.ini (gitignored).

[medcard_audio]
; Show «Fill medcard from audio» in the staff bot cabinet (1|0).
bot_enabled=1
; direct = write fields with source audio_bot (whole-card review + confirm in UI)
; propose = create pending base_doc_proposals (per-field accept)
fill_mode=direct
; Optional LlmConfig profile id; empty = default ready profile.
llm_profile=
; LLM completion budget for a full visit sheet.
max_tokens=8000
; Used when the model omits confidence (0..1).
confidence_default=0.75
