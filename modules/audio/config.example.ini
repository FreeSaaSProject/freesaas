[storage]
; Non-secret defaults; live overrides also in base_audio_settings via Settings UI.
; FTP password stays here only (never in Settings / DB).
mode="local"
audio_inbox="audio"
audio_parsed="audioParsed"
audio_chunks="audiochunks"
ftp_host=""
ftp_port="21"
ftp_user=""
ftp_pass=""
ftp_base_path="/"
ftp_http_url=""

[audio]
; Shared secret for /audio/asr/* and /audio/jobs/* (header X-Audio-Token or ?token=).
worker_token="CHANGE_ME"
stem_cache_dir="var/audio_stem_cache"
; HTTP job runners (shared hosting cron → curl)
job_batch_size="40"
job_time_budget_sec="45"
asr_claim_ttl_sec="90"
