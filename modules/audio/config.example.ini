[storage]
; Live values written by /audio/settings (superadmin) via Config into cfg/modules/audio.ini.
mode="local"
audio_inbox="audio"
audio_parsed="audioParsed"
audio_chunks="audiochunks"
ftp_host=""
ftp_port="21"
ftp_user=""
ftp_pass=""
ftp_base_path="/"
ftp_http_url=""

[audio]
; Legacy worker token — prefer [asr] worker_token in cfg/modules/asr.ini.
; Still accepted as fallback by AsrWorkerAuth when asr token is unset.
worker_token="CHANGE_ME"
stem_cache_dir="var/audio_stem_cache"
; phpMorphy: leave empty to use bundled modules/audio_pipeline/vendor/phpmorphy (LGPL-2.1+).
; Override only if you keep a shared install elsewhere.
phpmorphy_dir=""
; HTTP job runners (shared hosting cron → curl)
; After key edits: DT_PARSED reset → enqueue /audio/jobs/stem (or /run sync); Cron drains until pending=0.
job_batch_size="40"
job_time_budget_sec="45"
asr_claim_ttl_sec="90"
; Late ASR result for a past day → that day's collect + staff report publish no sooner than this (sec).
; Further results for the same day do not postpone it. Morning sweep 07:00 covers yesterday anyway.
late_stem_delay_sec="3600"
; After day collect: disable records outside rated collections / procedure windows / pending review.
; Only for staff roles with DISABLE_NON_PROCEDURE_TIME. Default off until enabled in /audio/settings.
; Per-status / per-staff overrides: base_records_coverage_profiles (UI on /audio/settings).
disable_outside_coverage="0"
; Soft procedure↔session compare on day-report (also overridable per role/staff). Default off.
match_procedures="0"
procedure_buffer_sec="1600"
; Paid procedure min duration (sec) for keep/compare. Default 6 minutes.
min_procedure_sec="360"
