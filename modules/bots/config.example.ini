; Copy to cfg/modules/bots.ini (gitignored). Tokens/secrets — never commit live values.
[bots]
; Staff bots (audience=staff, BOT_SOURCE=2)
staff_telegram_token =
; Required when token is set. Telegram setWebhook secret_token must match.
; Empty secret is rejected (fail-closed) unless allow_unsigned_webhooks=1.
; Saving settings with a token and empty secret auto-generates a 64-hex secret.
staff_telegram_webhook_secret =
staff_max_token =
staff_max_webhook_secret =

; Client bots (audience=client, BOT_SOURCE=1) — needs clients module for phone link
client_telegram_token =
client_telegram_webhook_secret =
client_max_token =
client_max_webhook_secret =

; Dev only: accept webhooks when channel secret is empty. NEVER enable in production.
allow_unsigned_webhooks = 0

; Optional: skip SSL peer verify for Max (not recommended)
max_ssl_insecure = 0
