; Copy to cfg/modules/likespa.ini (gitignored).

[likespa]
; Public site host for promo preview links (no scheme), e.g. likespa.ru
mothersite=

; Feature toggles inside the LikeSpa instance pack.
term_scans_enabled=1
promo_enabled=1
dops_enabled=1
restores_enabled=1

; Promoter bonus (PRICE_COL on base_workweeks = promoter shift).
promo_price_col=4
promo_min_work_hours=6.8
promo_script_ids=4,20
promo_min_script_count=95
promo_min_conversion=20
promo_bonus_playtime=9000
promo_bonus_score_add=1.5
promo_term_scan_conversion=1
promo_term_scan_proc_window_hours=4

; Extra procedures (dops) badge on records calendar.
dops_procedure_type=44
; Comma-separated base_admin_statuses / user ID_STATUS ids (masseur positions).
dops_position_ids=1

; Procedure restores (автовзаиморасчёт → base_payments ACCOUNT=0, no DPS).
; Superadmin candidate window = today minus N days; others = today only.
restores_lookback_days=4
restores_payment_type=1

; Staff therm folio debts (oper gens/debts.php). Soft-deps: terminals (1C) + comments.
; Scans base_staff_bracelets → 1C debt_detail; posts hits as comments on news_id.
staff_debts_enabled=0
staff_debts_news_id=0
; 0 = fall back to connect.robot_id in cfg/config.ini
staff_debts_comment_user_id=0
staff_debts_daily_at=08:00

; Drop-in legacy HTTP API (/api_termy.php, /api.php, /api1c.php). Off by default.
; Empty legacy_api_key = open (legacy Termy parity). Set key for post-cutover hardening.
legacy_api_enabled=0
legacy_api_termy_category=16
legacy_api_key=
; Slot lead (seconds): ordinary /api.php = 10 min; api_termy = 20 min
lead_sec_api=600
lead_sec_termy=1200

