; Copy to cfg/modules/core.ini (gitignored). Platform chrome settings owned by core.

[core]
; Bot alert when FreeSaaS cannot reach an edge host gateway (first failure + recovery).
edge_notify_enabled = 1
; Max/Telegram group chat_id (negative for Max groups). Empty = only staff_ids.
edge_notify_chat_id =
; max | telegram | both — required when chat_id is set
edge_notify_platform = max
; Optional comma-separated base_users.ID with staff bot link
edge_notify_staff_ids =
