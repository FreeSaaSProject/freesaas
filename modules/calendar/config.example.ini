[calendar]
; Salon working hours (UI: /calendar/settings). Calendar axis, online booking and badges read them.
hour_start=9
hour_end=21
; Minutes of the booking window edges (0–59).
minute_start=0
minute_end=0
; Event mode: blocks = timeline blocks only (spa); visits = full visit basket.
; Legacy manual_create=0/1 is still read as fallback when event_mode is unset.
event_mode=blocks
; Short chips (≤ N minutes) invert bg/fg on the timeline. 0 = off. Default 10.
compact_chip_minutes=10
