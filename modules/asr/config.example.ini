[asr]
; Shared secret for ASR workers (header X-Audio-Token or ?token=).
; Used by /asr/voice-transcribe/* and (when audio_pipeline is on) /audio/asr/* + /audio/jobs/*.
; Legacy fallback: [audio] worker_token in cfg/modules/audio.ini.
worker_token="CHANGE_ME"
; Messenger voice queue (var/voice_transcribe): days to keep finished jobs (text) and orphan audio.
voice_retention_days=7
; Safety net: processing jobs older than this go back to pending (long visit recordings take a while).
voice_processing_ttl_sec=10800
; After a bot hands voice to a push worker, keep polling for the result this long (0 = rely on cron only).
voice_follow_sec=150
