; Copy to cfg/modules/stickers.ini (gitignored).

[stickers]
; Anonymous A4 print sheet at GET /stickers/printstickers (oper printstickers=1).
; Off by default. When on: GET-only sheet of pending labels — no edit, no JSON, no id filter.
public_print_enabled=0
; How a sticker becomes active (allowed to be written off):
;   scan   — only by scanning its QR after it is stuck on the item (default, staff sees the product)
;   manual — also by the "Activate" checkbox when receiving (sticker can then be stuck anywhere)
activation_mode=scan
