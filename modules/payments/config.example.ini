; Copy to cfg/modules/payments.ini (gitignored).
; Daily payroll (role flag PAY_DAILY) — cash issuer matches ID_STATUS2.

[payments]
day_pay_min_pay = 3000
day_pay_payout_account_id = 0
day_pay_issuer_status2 = 17
; Upsert current-month «% МЕСЯЦ YYYY» accrual via procents when opening /payments or /procents for one staff (skipped for PAY_DAILY).
auto_procent_accrual = 1
; Hide salary in calendar /payments /procents until the viewer clears unread feed / unviewed reviews.
hide_salary_unread_news = 0
hide_salary_unread_reviews = 0
; When 1, the gates above also apply to SUPERADMIN_ACCESS (default off).
hide_salary_apply_superadmin = 0
; Auto-create settlement (ACCOUNT=0) when acceptor clicks «Accept work» on an offer.
auto_pay_on_work_accept = 0
; Auto work-accept + settlement when staff_reports / cyclic LLM creates a PRICE_OFFER.
auto_pay_on_audio_contract = 0
