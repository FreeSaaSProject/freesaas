[workweeks]
; News/ticket ID where schedule changes are logged as comments (requires comments module).
; 0 = do not log.
schedule_news_id=0

; Log nazcab table/section changes to the same news card.
; 1|all = everyone who can nazcab (default); assign = EVT_ASSIGN only; off = never.
log_table_changes=1

; Shift windows (PRICE_COL lanes). Factory defaults 1..5; add more via /workweeks/settings.
; shift_ids lists active lane ids (comma-separated). Optional shift_N_units overrides
; LOSS_FIX pay units (default: auto — composite covering ≥2 shorter lanes = 2).
; shift_ids=1,2,3,4,5
shift_1_start=00:00
shift_1_end=15:30
shift_1_label=I
shift_2_start=15:30
shift_2_end=23:59
shift_2_label=II
shift_3_start=00:00
shift_3_end=23:59
shift_3_label=I+II
; shift_3_units=2
shift_4_start=09:30
shift_4_end=17:00
shift_4_label=IV
shift_5_start=14:00
shift_5_end=21:30
shift_5_label=V
