[workweeks]
; News/ticket ID where schedule changes are logged as comments (requires comments module).
; 0 = do not log. First read may seed from legacy base_system.NEWS_SCHEDULE_ID.
schedule_news_id=0

; Shift windows for PRICE_COL 1..5 (oper adminWorkTime defaults).
; Optional shift_N_units overrides LOSS_FIX pay units (default: auto — composite
; window that fully covers ≥2 shorter lanes, e.g. I+II, counts as 2; else 1).
shift_1_start=00:00
shift_1_end=15:30
shift_1_label=I
shift_2_start=15:30
shift_2_end=23:59
shift_2_label=II
shift_3_start=00:00
shift_3_end=23:59
shift_3_label=I+II
; shift_3_units=2
shift_4_start=09:30
shift_4_end=17:00
shift_4_label=IV
shift_5_start=14:00
shift_5_end=21:30
shift_5_label=V
