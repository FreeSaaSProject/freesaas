; Example only — never commit live secrets. Prefer configs/local.json for workers host.
; Live runtime may also write audioloader.ini under the plugin data dir (same keys).

[audioloader]
excluded_drives = C
messenger_target = telegram
telegram_token =
telegram_chat_id =
max_token =
max_chat_id =
ftp_host =
ftp_port = 21
ftp_user =
ftp_password =
ftp_folder = audio
; Full GET URL from FreeSaaS /audio/settings (Ingest URL), or leave empty if JSON has server+worker_token
post_upload_webhook_url =
poll_interval_sec = 120
drive_stable_delay_sec = 3
drive_access_timeout_sec = 15
slice_duration_sec = 360
mp3_name_template = EM_CARD_{date}-{time}_NML_{serial}.mp3
; External LAME — do not vendor binaries into git. Empty = look for lame.exe in data dir / PATH
lame_path =
debug = 0
configured = 1
auto_restart = 0
pc_recording_enabled = 0
